# Сборка iOS и отправка в TestFlight.
# Собираем на macOS-раннере GitHub, без облака Expo: expo prebuild создаёт нативный
# проект, дальше обычные xcodebuild и altool.
# Подпись ручная: сертификат и профиль выпущены заранее и лежат в секретах репозитория.
name: iOS TestFlight

on:
  # Кнопкой из интерфейса
  workflow_dispatch:
    inputs:
      notes:
        description: Что нового в этой сборке
        required: false
        default: Тестовая сборка
  # Или пушем в отдельную ветку — так сборку можно запустить без прав на Actions
  push:
    branches: [build-ios]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Окружение
        run: |
          echo "Доступные Xcode:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          # По умолчанию раннер даёт Xcode 16.4 — он старше, чем нужно
          # для Expo SDK 57 и React Native 0.86. Берём новейший установленный.
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          echo "Выбран: $NEWEST"
          xcodebuild -version
          echo "node $(node -v) · npm $(npm -v) · pod $(pod --version)"

      - name: Зависимости
        run: npm ci

      - name: Нативный проект из конфигурации Expo
        run: npx expo prebuild --platform ios --no-install --clean

      - name: CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Сертификат и профиль подписи
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          # Временная связка ключей: живёт только внутри этого запуска
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASS=$(openssl rand -hex 20)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          echo "$CERT_P12" | base64 --decode > $RUNNER_TEMP/dist.p12
          security import $RUNNER_TEMP/dist.p12 -k "$KEYCHAIN" -P "$CERT_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          rm -f $RUNNER_TEMP/dist.p12

          PROFILES=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES"
          echo "$PROFILE" | base64 --decode > "$PROFILES/MagasPadel.mobileprovision"
          UUID=$(security cms -D -i "$PROFILES/MagasPadel.mobileprovision" \
            | plutil -extract UUID raw -o - -)
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "Профиль установлен: $UUID"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Архив
        run: |
          set -o pipefail
          # ls без -d показывает содержимое каталога .xcworkspace, а не его имя
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Рабочее пространство: $WS"
          xcodebuild -workspace "$WS" -list
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          xcodebuild archive \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/MagasPadel.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=SGS6KFDCD4 \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            2>&1 | tee "$RUNNER_TEMP/build.log" | xcpretty || {
              echo "─── последние 250 строк полного лога ───"
              tail -250 "$RUNNER_TEMP/build.log"
              echo "─── строки с ошибками ───"
              grep -nE "error:|fatal|FAILED|No such file" "$RUNNER_TEMP/build.log" | tail -40
              exit 1
            }

      - name: Сборка .ipa
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>SGS6KFDCD4</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>ru.padelmagas.app</key><string>$PROFILE_UUID</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MagasPadel.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist"
          ls -la "$RUNNER_TEMP/export"

      - name: Отправка в TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "Отправляю: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Сохранить .ipa как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn

      - name: Сохранить полный лог сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn
