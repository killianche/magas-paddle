# База и кэш для Magas Padel.
# Стоят на том же сервере, что и чужой Supabase, но полностью отдельно:
# своя сеть, свои тома, порты слушают только localhost и не пересекаются с занятыми.
name: magas-padel

services:
  db:
    image: postgres:17-alpine
    container_name: magas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: magas
      POSTGRES_USER: magas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?нужен DB_PASSWORD в .env}
      # Локаль для правильной сортировки русских названий
      LANG: ru_RU.UTF-8
      TZ: Europe/Moscow
    ports:
      # Только localhost: снаружи база недоступна, ходим через SSH-туннель
      - "127.0.0.1:5433:5432"
    volumes:
      - magas-db-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magas -d magas"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          # Сервер общий: ограничиваем аппетит, чтобы не задеть соседний проект
          memory: 640M

  cache:
    image: redis:7-alpine
    container_name: magas-cache
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - magas-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 192M

  api:
    build: ./api
    container_name: magas-api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }
    environment:
      # Внутри сети Compose база доступна по имени службы
      DATABASE_URL: postgresql://magas:${DB_PASSWORD}@db:5432/magas?schema=public
      REDIS_URL: redis://cache:6379
      # Ключ входа в админку: общий для персонала клуба
      ADMIN_KEY: ${ADMIN_KEY:?нужен ADMIN_KEY в .env}
      PORT: 3001
      TZ: Europe/Moscow
    ports:
      # Наружу не публикуем: доступ только через nginx
      - "127.0.0.1:3001:3001"
    volumes:
      # Фото площадок: пишет приложение, отдаёт nginx напрямую
      - /var/www/padelmagas/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  magas-db-data:
  magas-cache-data:
